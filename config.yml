# ================================================================
#                     PlayerProgress 2.0 — конфиг
# ================================================================
# Познания (ключи): attack, defense, agility, magic, building,
#                   gathering, mining, farming
# Цвета: &a, &c, &l ... и HEX: &#ff8800
# После изменений: /pp reload
# ================================================================

settings:
  max-level: 32
  # Миры, где PlayerProgress выключен: нет ограничений, нет бонусов
  # атрибутов, очки не начисляются, усилители и прокачка не работают.
  # Меню открыть можно (только просмотр).
  disabled-worlds:
    - example_world
  # Игроки в творческом режиме и наблюдатели игнорируют ограничения
  # и не получают очки.
  bypass-creative: true
  # Ограничивать "физическое" взаимодействие с блоками
  # (наступить на нажимную плиту, растоптать грядку).
  restrict-physical-interaction: true
  # Удалять запрещённую броню/элитры со слотов брони (проверка раз в секунду).
  armor-check: true
  # Показывать полученные очки в action bar.
  actionbar-on-points: true
  # Перестать начислять очки, если познание уже максимального уровня.
  stop-points-at-max-level: true
  # Как часто (в минутах) пересчитывать топы.
  top-update-minutes: 5
  # Как часто (в секундах) сохранять данные в базу.
  autosave-seconds: 60

# ----------------------------------------------------------------
#  Названия и иконки познаний (иконки — в меню)
# ----------------------------------------------------------------
skills:
  attack:    { name: "&cАтака",          icon: IRON_SWORD }
  defense:   { name: "&9Защита",         icon: SHIELD }
  agility:   { name: "&aВыносливость",   icon: LEATHER_BOOTS }
  magic:     { name: "&dМагия",          icon: ENCHANTED_BOOK }
  building:  { name: "&eСтроительство",  icon: BRICKS }
  gathering: { name: "&2Собирательство", icon: OAK_LOG }
  mining:    { name: "&6Горное дело",    icon: IRON_PICKAXE }
  farming:   { name: "&aЗемледелие",     icon: WHEAT }

# ----------------------------------------------------------------
#  Прокачка: очки + уровни опыта
# ----------------------------------------------------------------
# Чтобы получить уровень N познания, нужно потратить:
#   очки  = points-per-level × N   (или число из custom, если указано)
#   опыт  = (N - 1) × xp-cost-per-level уровней опыта
#           (2 ур. = 1 опыт, 3 ур. = 2 опыта, ... 32 ур. = 31 опыт)
# В custom можно вручную задать очки для отдельных уровней, например:
#   custom:
#     2: 5
#     32: 2000
leveling:
  xp-cost-per-level: 1
  skills:
    attack:    { points-per-level: 15, custom: {} }
    defense:   { points-per-level: 15, custom: {} }
    agility:   { points-per-level: 10, custom: {} }
    magic:     { points-per-level: 8,  custom: {} }
    building:  { points-per-level: 40, custom: {} }
    gathering: { points-per-level: 25, custom: {} }
    mining:    { points-per-level: 40, custom: {} }
    farming:   { points-per-level: 25, custom: {} }

# ----------------------------------------------------------------
#  Очки за действия (0 — отключить действие)
# ----------------------------------------------------------------
actions:
  attack:
    kill-hostile: 1        # убийство враждебного моба
  defense:
    shield-block: 1        # заблокированный щитом удар
    armor-damage: 1        # за каждые armor-damage-step урона, полученного в броне
  agility:
    distance: 1            # за каждые distance-step пройденных блоков
  magic:
    enchant: 3             # зачарование на столе
    brew: 1                # за каждое сваренное зелье
  building:
    place: 1               # установка блока
  gathering:
    log: 1                 # природное бревно / стебель
    fish: 1                # пойманная рыба (удочкой)
    flower: 1              # природный цветок
    berry: 1               # сбор ягод (сладкие и светящиеся)
    mushroom: 1            # природный гриб
  mining:
    stone: 1               # природный камень
    ore: 3                 # природная руда
  farming:
    harvest: 1             # сбор спелого урожая
    breed: 1               # разведение животных

action-settings:
  armor-damage-step: 5
  distance-step: 100
  # Какие передвижения считаются для Выносливости (статистика Minecraft).
  # Только то, что требует постоянного нажатия клавиш. Элитры и вагонетки не считаются.
  distance-statistics:
    - WALK_ONE_CM
    - SPRINT_ONE_CM
    - CROUCH_ONE_CM
    - SWIM_ONE_CM
    - WALK_ON_WATER_ONE_CM
    - WALK_UNDER_WATER_ONE_CM
    - CLIMB_ONE_CM
    - HORSE_ONE_CM
    - BOAT_ONE_CM
    - HAPPY_GHAST_ONE_CM
  distance-check-seconds: 5
  # Мобы, появившиеся по этим причинам, не дают очков Атаки.
  excluded-spawn-reasons:
    - SPAWNER
  # Списки блоков. Можно писать точное имя или шаблон со звёздочкой.
  # Блоки, поставленные игроком, очков не дают (кроме спелых посевов).
  stone-blocks:
    - STONE
    - DEEPSLATE
    - COBBLESTONE
    - COBBLED_DEEPSLATE
    - GRANITE
    - DIORITE
    - ANDESITE
    - TUFF
    - CALCITE
    - DRIPSTONE_BLOCK
    - NETHERRACK
    - BASALT
    - BLACKSTONE
    - END_STONE
    - SANDSTONE
    - RED_SANDSTONE
  ore-blocks:
    - "*_ORE"
    - ANCIENT_DEBRIS
  log-blocks:
    - "*_LOG"
    - "*_WOOD"
    - CRIMSON_STEM
    - WARPED_STEM
    - CRIMSON_HYPHAE
    - WARPED_HYPHAE
    - BAMBOO_BLOCK
  flower-blocks:
    - DANDELION
    - POPPY
    - BLUE_ORCHID
    - ALLIUM
    - AZURE_BLUET
    - "*_TULIP"
    - OXEYE_DAISY
    - CORNFLOWER
    - LILY_OF_THE_VALLEY
    - SUNFLOWER
    - LILAC
    - ROSE_BUSH
    - PEONY
    - TORCHFLOWER
    - PITCHER_PLANT
    - PINK_PETALS
    - WILDFLOWERS
    - OPEN_EYEBLOSSOM
    - CLOSED_EYEBLOSSOM
    - SPORE_BLOSSOM
    - CACTUS_FLOWER
  mushroom-blocks:
    - BROWN_MUSHROOM
    - RED_MUSHROOM
    - CRIMSON_FUNGUS
    - WARPED_FUNGUS
  # Посевы: очки только если растение полностью выросло.
  crop-blocks:
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - NETHER_WART
    - COCOA
    - TORCHFLOWER_CROP
    - PITCHER_CROP
  # Урожай без стадий роста: очки, если блок не поставлен игроком.
  natural-harvest-blocks:
    - MELON
    - PUMPKIN
    - SUGAR_CANE
    - CACTUS
    - BAMBOO

