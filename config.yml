# ----------------------------------------------------------------
#  ItemsAdder
# ----------------------------------------------------------------
# Для предметов ItemsAdder базовый ванильный материал игнорируется,
# действуют только правила ниже. Формат ID: namespace:id
itemsadder:
  # Кастомные предметы (оружие, инструменты, броня, еда, ...)
  items: {}
  #  "myitems:fire_sword":
  #    attack: 16
  #    agility: 8
  # Кастомные блоки и мебель
  blocks: {}
  #  "myitems:magic_table":
  #    magic: 10
  #    building: 8

# ----------------------------------------------------------------
#  Усилители (только предметы ItemsAdder)
# ----------------------------------------------------------------
# item — ID предмета ItemsAdder. Без ItemsAdder усилители не работают.
# increase-chance — шанс +1 уровень (%), decrease-chance — шанс -1 уровень (%),
# остаток — ничего не произойдёт.
# Право на использование: playerprogress.booster.<ключ> (по умолчанию есть у всех).
boosters:
  attack:    { item: "playerprogress:booster_attack",    increase-chance: 80, decrease-chance: 5 }
  defense:   { item: "playerprogress:booster_defense",   increase-chance: 80, decrease-chance: 5 }
  agility:   { item: "playerprogress:booster_agility",   increase-chance: 80, decrease-chance: 5 }
  magic:     { item: "playerprogress:booster_magic",     increase-chance: 80, decrease-chance: 5 }
  building:  { item: "playerprogress:booster_building",  increase-chance: 80, decrease-chance: 5 }
  gathering: { item: "playerprogress:booster_gathering", increase-chance: 80, decrease-chance: 5 }
  mining:    { item: "playerprogress:booster_mining",    increase-chance: 80, decrease-chance: 5 }
  farming:   { item: "playerprogress:booster_farming",   increase-chance: 80, decrease-chance: 5 }
  random:    { item: "playerprogress:booster_random",    increase-chance: 70, decrease-chance: 10 }

