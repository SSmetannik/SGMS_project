name: Build PlayerProgress

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -U package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PlayerProgress
          path: target/PlayerProgress-*.jar
